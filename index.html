<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Төрт-Гүл айыл өкмөтү — Онлайн табло</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  @keyframes pulse-dot{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}100%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}
  .pulse{animation:pulse-dot 1.6s infinite}
  @keyframes sheet-in{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet{animation:sheet-in .25s ease-out}
  .skel{background:linear-gradient(90deg,rgba(148,163,184,.15),rgba(148,163,184,.3),rgba(148,163,184,.15));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">

<!-- HERO -->
<header class="bg-gradient-to-br from-teal-700 via-teal-600 to-emerald-500 text-white" style="padding-top:env(safe-area-inset-top)">
  <div class="max-w-5xl mx-auto px-4 pt-8 pb-16 sm:pt-12 sm:pb-20">
    <p class="text-teal-100 text-sm font-medium tracking-wide">Төрт-Гүл айыл өкмөтү</p>
    <h1 class="mt-1 text-3xl sm:text-4xl font-extrabold leading-tight">Онлайн табло</h1>
    <p class="mt-2 text-teal-50/90 text-sm sm:text-base max-w-xl">Кызматкерлердин азыркы абалын көрүңүз, байланышыңыз жана иштерине баа бериңиз.</p>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 -mt-10 pb-28">
  <!-- Filter chips -->
  <div id="chips" class="grid grid-cols-3 gap-2 sm:gap-3"></div>

  <!-- Search -->
  <div class="mt-4 relative">
    <svg class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Аты-жөнү же кызматы боюнча издөө" class="w-full rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 pl-11 pr-4 py-3.5 text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
  </div>

  <div class="mt-3 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
    <span id="updated">Жүктөлүүдө…</span>
    <button id="refresh" class="font-semibold text-teal-700 dark:text-teal-400">Жаңылоо</button>
  </div>

  <div id="error" class="hidden mt-4 rounded-2xl bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 p-4 text-sm"></div>
  <div id="list" class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
  <p id="empty" class="hidden text-center text-slate-500 py-12">Эч нерсе табылган жок</p>
</main>

<!-- Floating button -->
<div class="fixed inset-x-0 bottom-0 z-30 p-4 pointer-events-none" style="padding-bottom:calc(1rem + env(safe-area-inset-bottom))">
  <div class="max-w-5xl mx-auto flex justify-center sm:justify-end">
    <button onclick="openSheet('')" class="pointer-events-auto flex items-center gap-2 rounded-full bg-teal-600 hover:bg-teal-700 text-white font-semibold px-6 py-3.5 shadow-lg shadow-teal-900/30 active:scale-95 transition">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.5l7.1-.6z"/></svg>
      Пикир калтыруу
    </button>
  </div>
</div>

<!-- Feedback sheet -->
<div id="overlay" class="hidden fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeSheet()">
  <div class="sheet w-full sm:max-w-lg bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl max-h-[92vh] overflow-y-auto p-5 sm:p-6" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))">
    <div id="formBox">
      <div class="flex items-start justify-between">
        <div>
          <h2 class="text-xl font-bold">Пикир жана баа</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Сиздин пикириңиз кызматты жакшыртат</p>
        </div>
        <button onclick="closeSheet()" class="p-2 -mr-2 text-slate-400" aria-label="Жабуу"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>

      <label class="block mt-4 text-sm font-semibold">Кимге?</label>
      <select id="fEmp" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3.5 py-3 text-base"></select>

      <label class="block mt-4 text-sm font-semibold">Баа (1ден 10го чейин) <span class="text-rose-500">*</span></label>
      <div id="stars" class="mt-2 grid grid-cols-5 gap-2"></div>

      <label class="block mt-4 text-sm font-semibold">Пикир <span class="text-rose-500">*</span></label>
      <textarea id="fText" rows="4" maxlength="1000" placeholder="Кеминде 10 тамга жазыңыз…" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3.5 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
      <div id="count" class="text-xs text-slate-400 text-right">0 / 10</div>

      <div class="grid sm:grid-cols-2 gap-3 mt-2">
        <div><label class="block text-sm font-semibold">Атыңыз <span class="font-normal text-slate-400">(милдеттүү эмес)</span></label>
          <input id="fName" maxlength="80" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3.5 py-3 text-base"></div>
        <div><label class="block text-sm font-semibold">Телефон <span class="font-normal text-slate-400">(милдеттүү эмес)</span></label>
          <input id="fPhone" type="tel" inputmode="tel" maxlength="20" class="mt-1.5 w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3.5 py-3 text-base"></div>
      </div>
      <input id="fWeb" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">

      <p id="fErr" class="hidden mt-3 text-sm text-rose-600 dark:text-rose-400"></p>
      <button id="fSend" class="mt-5 w-full rounded-xl bg-teal-600 hover:bg-teal-700 disabled:opacity-60 text-white font-semibold py-3.5 active:scale-[.98] transition">Жөнөтүү</button>
    </div>

    <div id="thanks" class="hidden text-center py-10">
      <div class="mx-auto w-16 h-16 rounded-full bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 flex items-center justify-center">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg>
      </div>
      <h3 class="mt-4 text-xl font-bold">Рахмат!</h3>
      <p class="mt-1 text-slate-500 dark:text-slate-400">Пикириңиз кабыл алынды.</p>
      <button onclick="closeSheet()" class="mt-6 rounded-xl bg-slate-100 dark:bg-slate-800 px-6 py-3 font-semibold">Жабуу</button>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzzA30wgwigid7gKKjt7071LlRIQ-nMVZx63cjbGkdVoAtW5SJ-dVKwOiXdSmENuKfvrg/exec';

let staff = [], filter = 'all', query = '', rating = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = p => String(p || '').replace(/\D/g, '');
const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const hue = n => [...n].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;

const ST = {
  work: { label: 'Иште',          badge: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300', dot: 'bg-emerald-500 pulse' },
  trip: { label: 'Иш сапарда',    badge: 'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300',         dot: 'bg-amber-500' },
  off:  { label: 'Жумушта эмес',  badge: 'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300',             dot: 'bg-rose-500' }
};

function deviceId() {
  try {
    let d = localStorage.getItem('dev');
    if (!d) { d = [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('dev', d); }
    return d;
  } catch (e) { return 'anon'; }
}

async function load(silent) {
  if (!silent) $('list').innerHTML = Array(6).fill('<div class="skel h-40 rounded-3xl"></div>').join('');
  try {
    const r = await fetch(API + '?action=staff');
    const j = await r.json();
    if (!j.ok) throw new Error(j.message || 'Ката');
    staff = j.data.staff;
    $('updated').textContent = 'Жаңыртылды: ' + j.data.updated;
    $('error').classList.add('hidden');
    render();
  } catch (e) {
    $('error').textContent = 'Маалымат жүктөлгөн жок. Интернетти текшерип, «Жаңылоо» баскычын басыңыз. (' + (e.message || e) + ')';
    console.error(e);
    $('error').classList.remove('hidden');
    if (!silent) $('list').innerHTML = '';
  }
}

function render() {
  const n = s => staff.filter(x => x.status === s).length;
  const chip = (key, label, count, color) =>
    `<button onclick="setFilter('${key}')" class="rounded-2xl p-3 sm:p-4 text-left shadow-sm border transition active:scale-95 ${filter === key ? 'bg-white dark:bg-slate-800 border-teal-500 ring-2 ring-teal-500/30' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'}">
      <div class="text-2xl sm:text-3xl font-extrabold ${color}">${count}</div>
      <div class="text-[11px] sm:text-sm text-slate-500 dark:text-slate-400 leading-tight mt-0.5">${label}</div></button>`;
  $('chips').innerHTML = chip('work', 'Иште', n('work'), 'text-emerald-600') + chip('trip', 'Иш сапарда', n('trip'), 'text-amber-500') + chip('off', 'Жумушта эмес', n('off'), 'text-rose-500');

  const order = { work: 0, trip: 1, off: 2 };
  const q = query.trim().toLowerCase();
  const items = staff
    .filter(s => (filter === 'all' || s.status === filter) && (!q || (s.name + ' ' + s.position).toLowerCase().includes(q)))
    .sort((a, b) => order[a.status] - order[b.status]);

  $('empty').classList.toggle('hidden', items.length > 0 || !staff.length);
  $('list').innerHTML = items.map(card).join('');
}

function card(s) {
  const st = ST[s.status] || ST.off;
  const ph = digits(s.phone);
  const avatar = s.photo
    ? `<img src="${esc(s.photo)}" alt="" class="w-14 h-14 rounded-2xl object-cover shrink-0">`
    : `<div class="w-14 h-14 rounded-2xl shrink-0 flex items-center justify-center text-white font-bold text-lg" style="background:linear-gradient(135deg,hsl(${hue(s.name)} 65% 45%),hsl(${(hue(s.name) + 40) % 360} 70% 55%))">${esc(initials(s.name))}</div>`;
  let info = '';
  if (s.status === 'work') info = `Келген убактысы: <b>${esc(s.since)}</b>`;
  if (s.status === 'trip') info = `Кеткен убактысы: <b>${esc(s.since)}</b>${s.details ? '<br>Багыты: ' + esc(s.details) : ''}`;
  return `<article class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm hover:shadow-md transition">
    <div class="flex gap-3">${avatar}
      <div class="min-w-0">
        <h3 class="font-bold leading-snug">${esc(s.name)}</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400 leading-snug">${esc(s.position)}</p>
      </div></div>
    <div class="mt-3 inline-flex items-center gap-2 rounded-full px-3 py-1 text-sm font-semibold ${st.badge}"><span class="w-2 h-2 rounded-full ${st.dot}"></span>${st.label}</div>
    ${info ? `<p class="mt-2 text-sm text-slate-600 dark:text-slate-300">${info}</p>` : ''}
    <div class="mt-4 grid ${ph ? 'grid-cols-3' : 'grid-cols-1'} gap-2">
      ${ph ? `<a href="tel:+${ph}" class="flex items-center justify-center gap-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 py-2.5 text-sm font-semibold active:scale-95 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Чалуу</a>
      <a href="https://wa.me/${ph}" target="_blank" rel="noopener" class="flex items-center justify-center rounded-xl bg-emerald-50 dark:bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 py-2.5 text-sm font-semibold active:scale-95 transition">WhatsApp</a>` : ''}
      <button onclick="openSheet('${esc(s.id)}')" class="rounded-xl bg-teal-50 dark:bg-teal-500/15 text-teal-700 dark:text-teal-300 py-2.5 text-sm font-semibold active:scale-95 transition">Баа берүү</button>
    </div></article>`;
}

function setFilter(k) { filter = filter === k ? 'all' : k; render(); }

/* ---------- Feedback ---------- */
function paintStars() {
  $('stars').innerHTML = Array.from({ length: 10 }, (_, i) => i + 1).map(n =>
    `<button type="button" onclick="setRating(${n})" class="h-12 rounded-xl font-bold text-lg border transition active:scale-95 ${n <= rating ? 'bg-amber-400 border-amber-400 text-white' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500'}">${n}</button>`).join('');
}
function setRating(n) { rating = n; paintStars(); }

function openSheet(id) {
  $('fEmp').innerHTML = '<option value="">Айыл өкмөтү (жалпы)</option>' +
    staff.slice().sort((a, b) => a.name.localeCompare(b.name)).map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  $('fEmp').value = id || '';
  rating = 0; paintStars();
  ['fText', 'fName', 'fPhone'].forEach(k => $(k).value = '');
  $('count').textContent = '0 / 10'; $('fErr').classList.add('hidden');
  $('formBox').classList.remove('hidden'); $('thanks').classList.add('hidden');
  $('overlay').classList.remove('hidden'); document.body.style.overflow = 'hidden';
}
function closeSheet() { $('overlay').classList.add('hidden'); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

$('fText').addEventListener('input', e => {
  const n = e.target.value.trim().length;
  $('count').textContent = n + ' / 10';
  $('count').className = 'text-xs text-right ' + (n >= 10 ? 'text-emerald-600' : 'text-slate-400');
});

$('fSend').addEventListener('click', async () => {
  const err = m => { $('fErr').textContent = m; $('fErr').classList.remove('hidden'); };
  const text = $('fText').value.trim();
  if (!rating) return err('Баа тандаңыз (1ден 10го чейин).');
  if (text.length < 10) return err('Пикир кеминде 10 тамгадан турушу керек.');
  $('fErr').classList.add('hidden');
  $('fSend').disabled = true; $('fSend').textContent = 'Жөнөтүлүүдө…';
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({
      action: 'feedback', employeeId: $('fEmp').value, rating, text,
      residentName: $('fName').value, residentPhone: $('fPhone').value,
      website: $('fWeb').value, deviceId: deviceId()
    })});
    const j = await r.json();
    if (!j.ok) throw new Error(j.message || 'Ката кетти');
    $('formBox').classList.add('hidden'); $('thanks').classList.remove('hidden');
  } catch (e) {
    err(e.message || 'Жөнөтүү мүмкүн болгон жок. Кайра аракет кылыңыз.');
  }
  $('fSend').disabled = false; $('fSend').textContent = 'Жөнөтүү';
});

$('search').addEventListener('input', e => { query = e.target.value; render(); });
$('refresh').addEventListener('click', () => load(false));
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
setInterval(() => { if (!document.hidden) load(true); }, 30000);
load(false);
</script>
</body>
</html>
